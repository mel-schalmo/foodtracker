<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macro Ledger — food search</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 560px;
    margin: 60px auto;
    padding: 0 20px;
    line-height: 1.5;
    color: #20242B;
    background: #F2F1E6;
  }
  h1 { font-size: 1.4rem; }
  p { color: #3a3f47; }
  a { color: #2E5C8A; }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 0.95rem;
    border: 1px solid #CBC7B2;
    border-radius: 7px;
    background: #FBFAF3;
    color: #20242B;
    box-sizing: border-box;
  }
  .results { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .result {
    background: #FBFAF3;
    border: 1px solid #CBC7B2;
    border-radius: 8px;
    padding: 10px 12px;
  }
  .result .name { font-weight: 600; }
  .result .brand { font-size: 0.78rem; color: #6B6A5C; }
  .result .macros { font-size: 0.8rem; color: #6B6A5C; margin-top: 4px; font-family: ui-monospace, monospace; }
  .status { font-size: 0.85rem; color: #6B6A5C; margin-top: 8px; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>Macro Ledger — step 2: real food search</h1>
  <p>Search pulls live from
     <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a>,
     a free, open database of real branded/packaged products — not the fixed
     list from the earlier prototype.</p>

  <input type="text" id="searchInput" placeholder="Try a brand name, e.g. Hidden Valley Ranch">
  <div class="status" id="status"></div>
  <div class="results" id="results"></div>

  <script>
    var input = document.getElementById('searchInput');
    var statusEl = document.getElementById('status');
    var results = document.getElementById('results');
    var debounceTimer = null;
    var latestQuery = '';

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function runSearch(q) {
      latestQuery = q;
      if (!q.trim()) { results.innerHTML = ''; statusEl.textContent = ''; return; }
      statusEl.textContent = 'Searching Open Food Facts…';
      results.innerHTML = '';

      fetch('/.netlify/functions/search-food?q=' + encodeURIComponent(q))
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (wrapped) {
          if (q !== latestQuery) return;
          if (!wrapped.ok || wrapped.data.error) {
            throw new Error(wrapped.data.error || 'request failed');
          }
          var data = wrapped.data;
          if (!data.results.length) {
            statusEl.textContent = 'No results for "' + q + '".';
            return;
          }
          statusEl.textContent = data.results.length + ' result(s):';
          results.innerHTML = data.results.map(function (r) {
            return '<div class="result">'
              + '<div class="name">' + esc(r.name) + '</div>'
              + (r.brand ? '<div class="brand">' + esc(r.brand) + '</div>' : '')
              + '<div class="macros">' + esc(r.servingLabel) + ' &middot; '
              + Math.round(r.calories) + ' cal, '
              + (r.protein != null ? Math.round(r.protein) : '?') + 'g P, '
              + (r.carbs != null ? Math.round(r.carbs) : '?') + 'g C, '
              + (r.fat != null ? Math.round(r.fat) : '?') + 'g F</div>'
              + '</div>';
          }).join('');
        })
        .catch(function (err) {
          if (q !== latestQuery) return;
          statusEl.textContent = 'Something went wrong: ' + err.message;
        });
    }

    input.addEventListener('input', function () {
      clearTimeout(debounceTimer);
      var q = input.value;
      debounceTimer = setTimeout(function () { runSearch(q); }, 400);
    });
  </script>
</body>
</html>
