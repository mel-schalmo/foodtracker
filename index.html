<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macro Ledger — pipeline test</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 560px;
    margin: 60px auto;
    padding: 0 20px;
    line-height: 1.5;
    color: #20242B;
    background: #F2F1E6;
  }
  h1 { font-size: 1.4rem; }
  button {
    background: #2E5C8A;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 10px 18px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { background: #1F3F5E; }
  pre {
    background: #FBFAF3;
    border: 1px solid #CBC7B2;
    border-radius: 8px;
    padding: 14px;
    margin-top: 16px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .status { font-size: 0.85rem; color: #6B6A5C; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Macro Ledger — step 1: pipeline test</h1>
  <p>This page doesn't do anything real yet. It just checks that three things
     are wired together correctly: this static page, deployed by Netlify from
     your GitHub repo, and a small serverless function (also deployed by
     Netlify) that the page can call.</p>

  <button id="testBtn">Test connection to backend</button>
  <div class="status" id="status"></div>
  <pre id="output" hidden></pre>

  <script>
    var btn = document.getElementById('testBtn');
    var statusEl = document.getElementById('status');
    var output = document.getElementById('output');

    btn.addEventListener('click', function () {
      statusEl.textContent = 'Calling /.netlify/functions/hello ...';
      output.hidden = true;

      fetch('/.netlify/functions/hello')
        .then(function (res) {
          if (!res.ok) throw new Error('Server responded with status ' + res.status);
          return res.json();
        })
        .then(function (data) {
          statusEl.textContent = 'Success — the frontend and backend are talking to each other.';
          output.textContent = JSON.stringify(data, null, 2);
          output.hidden = false;
        })
        .catch(function (err) {
          statusEl.textContent = 'Something went wrong: ' + err.message +
            ' (this usually means the function hasn\'t deployed yet, or the site is still building).';
        });
    });
  </script>
</body>
</html>
